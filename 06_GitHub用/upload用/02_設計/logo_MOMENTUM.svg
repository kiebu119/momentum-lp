<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Avenir Next, Futura, Century Gothic, Arial, sans-serif">
  <!-- ===== 案A:メインロゴ(横組み・MOM強調) ===== -->
  <g>
    <text x="60" y="70" font-size="16" letter-spacing="6" fill="#8BA888" font-weight="600">PROPOSAL A — PRIMARY</text>
    <!-- スピードライン(momentum=勢い) -->
    <g stroke="#D96C57" stroke-width="10" stroke-linecap="round">
      <line x1="28" y1="128" x2="52" y2="128"/>
      <line x1="14" y1="152" x2="52" y2="152"/>
      <line x1="28" y1="176" x2="52" y2="176"/>
    </g>
    <text x="70" y="178" font-size="88" font-weight="800" letter-spacing="2">
      <tspan fill="#D96C57">MOM</tspan><tspan fill="#3F3A36">ENTUM</tspan>
    </text>
    <!-- MOMの下にラウンド下線 -->
    <rect x="74" y="196" width="234" height="10" rx="5" fill="#D96C57"/>
    <text x="76" y="240" font-size="18" letter-spacing="7.5" fill="#8BA888" font-weight="600">FIT STUDIO · WOMEN ONLY · 30 MIN</text>
  </g>

  <!-- ===== 案B:スタック版(SNSアイコン・看板用) ===== -->
  <g>
    <text x="60" y="330" font-size="16" letter-spacing="6" fill="#8BA888" font-weight="600">PROPOSAL B — STACKED / ICON</text>
    <rect x="60" y="352" width="240" height="240" rx="48" fill="#FBF7F0" stroke="#E8DFD2" stroke-width="2"/>
    <text x="180" y="452" font-size="64" font-weight="800" text-anchor="middle" fill="#D96C57">MOM</text>
    <text x="180" y="512" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="1" fill="#3F3A36">ENTUM</text>
    <g stroke="#8BA888" stroke-width="6" stroke-linecap="round">
      <line x1="130" y1="544" x2="230" y2="544"/>
    </g>
    <text x="180" y="572" font-size="15" letter-spacing="4" text-anchor="middle" fill="#8BA888" font-weight="600">FIT STUDIO</text>
  </g>

  <!-- ===== 案C:ワンライン(LPヘッダー・フッター用) ===== -->
  <g>
    <text x="400" y="330" font-size="16" letter-spacing="6" fill="#8BA888" font-weight="600">PROPOSAL C — ONE LINE (HEADER)</text>
    <text x="400" y="400" font-size="44" font-weight="800" letter-spacing="1">
      <tspan fill="#D96C57">MOM</tspan><tspan fill="#3F3A36">ENTUM</tspan>
      <tspan fill="#8BA888" font-size="20" font-weight="600" dx="14" dy="-2">Fit Studio</tspan>
    </text>
    <!-- タグライン -->
    <text x="402" y="436" font-size="17" fill="#7A736B" font-style="italic">Your momentum starts with 30 minutes.</text>
    <!-- カラーパレット -->
    <g transform="translate(400,480)">
      <text x="0" y="-12" font-size="13" letter-spacing="3" fill="#8BA888" font-weight="600">COLOR PALETTE</text>
      <rect x="0" y="0" width="70" height="46" rx="8" fill="#D96C57"/><text x="0" y="66" font-size="12" fill="#7A736B">#D96C57</text>
      <rect x="86" y="0" width="70" height="46" rx="8" fill="#8BA888"/><text x="86" y="66" font-size="12" fill="#7A736B">#8BA888</text>
      <rect x="172" y="0" width="70" height="46" rx="8" fill="#3F3A36"/><text x="172" y="66" font-size="12" fill="#7A736B">#3F3A36</text>
      <rect x="258" y="0" width="70" height="46" rx="8" fill="#FBF7F0" stroke="#E8DFD2"/><text x="258" y="66" font-size="12" fill="#7A736B">#FBF7F0</text>
    </g>
    <text x="400" y="600" font-size="14" fill="#7A736B">MOM=コーラルで強調/勢いを表すスピードライン/推奨書体:Nunito ExtraBold 系</text>
  </g>
</svg>
